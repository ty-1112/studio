# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 2
  # The following line increases the timeout for server actions.
  # This can be useful for long-running AI generations.
  serverActionsTimeoutSeconds: 120
gcp-secret-manager:
  - secretName: GEMINI_API_KEY
    availableAt: GEMINI_API_KEY

# The following headers configuration is recommended for all frameworks.
# It improves security and simplifies authentication with the Firebase SDKs.
headers:
  - path: /
    headers:
      - key: Cache-Control
        value: "public, max-age=300, s-maxage=600"
      - key: Vary
        value: "Authorization, x-original-url, x-rewrite-url"
